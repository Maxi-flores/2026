<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026 Agenda</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, sans-serif;
        background: #0f0f0f;
        color: #f0f0f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
      }
      h1 { margin-bottom: 1.5rem; font-size: 2rem; }
      #app { width: 100%; max-width: 680px; }
      #auth-section { text-align: center; margin-bottom: 2rem; }
      #auth-section p { margin-bottom: 1rem; color: #aaa; }
      button {
        background: #3a3aff;
        color: #fff;
        border: none;
        padding: 0.6rem 1.4rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
      }
      button:hover { background: #5555ff; }
      #task-section { display: none; }
      #task-list { list-style: none; margin-bottom: 1rem; }
      #task-list li {
        background: #1e1e1e;
        border-radius: 6px;
        padding: 0.8rem 1rem;
        margin-bottom: 0.5rem;
        display: flex;
        gap: 0.8rem;
        align-items: center;
      }
      #task-list li.done span { text-decoration: line-through; color: #666; }
      #task-list li input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; }
      #add-task { display: flex; gap: 0.5rem; }
      #new-task-input {
        flex: 1;
        padding: 0.6rem 0.8rem;
        border-radius: 6px;
        border: 1px solid #333;
        background: #1e1e1e;
        color: #f0f0f0;
        font-size: 1rem;
      }
      #error-msg { color: #ff5555; margin-top: 1rem; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <h1>2026 Agenda</h1>
    <div id="app">
      <div id="auth-section">
        <p id="auth-status">Loading…</p>
        <button id="sign-in-btn" style="display:none">Sign in with Google</button>
        <button id="sign-out-btn" style="display:none">Sign out</button>
      </div>
      <div id="task-section">
        <ul id="task-list"></ul>
        <div id="add-task">
          <input id="new-task-input" type="text" placeholder="New task…" />
          <button id="add-task-btn">Add</button>
        </div>
      </div>
      <p id="error-msg"></p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
